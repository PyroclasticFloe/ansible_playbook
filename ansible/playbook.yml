---
- name: Install packages
  hosts: containers
  become: true
  roles:
    - packages

- name: Install containers
  hosts: containers
  become: true

  tasks:
    - name: Check for containers policy.json
      ansible.builtin.stat:
        path: /etc/containers/policy.json
      register: policy_json

    - name: Ensure containers policy.json exists
      ansible.builtin.copy:
        dest: /etc/containers/policy.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "default": [
              {
                "type": "insecureAcceptAnything"
              }
            ],
            "transports": {
              "docker-daemon": {
                "": [
                  {
                    "type": "insecureAcceptAnything"
                  }
                ]
              }
            }
          }
      when: not policy_json.stat.exists

    - name: Enable Podman API socket (Docker-compatible /run/podman/podman.sock)
      ansible.builtin.systemd:
        name: podman.socket
        state: started
        enabled: true

    - name: Install each container service
      ansible.builtin.include_role:
        name: containers
      vars:
        service_name: "{{ service.name if service is mapping else service }}"
        tailscale_hostname: "{{ (service.tailscale_hostname | default(service_name)) if service is mapping else service_name }}"
        start_service: "{{ service.start_service | default(true) if service is mapping else true }}"
      loop: "{{ enabled_services }}"
      loop_control:
        loop_var: service

    - name: Install BBS agent shell-hook scripts
      ansible.builtin.include_role:
        name: containers
        tasks_from: install_bbs_scripts.yml
      when: bbs_use_agent_scripts | default(false)

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: (changed_units | default([])) | length > 0

    - name: Restart services with changed configuration
      ansible.builtin.systemd:
        name: "{{ unit }}"
        state: restarted
      loop: "{{ (changed_units | default([])) | unique }}"
      loop_control:
        loop_var: unit
