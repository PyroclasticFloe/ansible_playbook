enabled_services:
  - searxng
  - homepage
  - jellyfin
  - name: forgejo
    needs_backup: false
    start_service: false
    needs_restore: true
    restore_time: "04:00"
    restore_from_repo: "ssh://de5097@de5097.rsync.net/./prodesk-forgejo"
    restore_from_label: "prodesk-forgejo"
    restore_from_host: prodesk
  - name: vaultwarden
    needs_backup: false
    start_service: false
    needs_restore: true
    restore_time: "04:00"
    restore_from_repo: "ssh://de5097@de5097.rsync.net/./vaultwarden"
    restore_from_label: "prodesk-vaultwarden"
    restore_from_host: prodesk
  - name: docker-socket-proxy
    tailscale_hostname: desktop-docker-proxy
    needs_backup: false
  - name: homarr
    needs_backup: false

# Socket proxies Homarr's Docker integration connects to (tailnet TCP).
# Add prodesk-docker-proxy.{{ tailnet_domain }} once prodesk is provisioned.
homarr_docker_hostnames: "desktop-docker-proxy.{{ tailnet_domain }},server-docker-proxy.{{ tailnet_domain }}"
homarr_docker_ports: "2375,2375"
is_gui: true
ansible_python_interpreter: /usr/bin/python3
