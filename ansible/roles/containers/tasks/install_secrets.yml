---
# Optional per-service secrets file. If services/<name>/env.j2 exists, it's
# rendered to {{ etc_dir }}/{{ service_name }}.env with 0600 perms, kept
# separate from the (git-committed, world-readable) quadlet files. The
# quadlet references it with EnvironmentFile=<that path>. Values should come
# from group_vars/all/vault.yml (encrypt with ansible-vault before pushing).

- name: Check for service secrets template
  ansible.builtin.stat:
    path: "{{ service_dir }}/env.j2"
  register: service_env_template

- name: Render service secrets file
  ansible.builtin.template:
    src: "{{ service_dir }}/env.j2"
    dest: "{{ etc_dir }}/{{ service_name }}.env"
    owner: root
    group: root
    mode: "0600"
  when: service_env_template.stat.exists
  notify: Restart service
