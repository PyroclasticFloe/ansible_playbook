enabled_services:
  - name: searxng
    needs_backup: false
  - name: jellyfin
    needs_backup: false
  - name: borg-backup-server
    needs_backup: false
  - name: docker-socket-proxy
    tailscale_hostname: desktop-docker-proxy
    needs_backup: false
  - name: homepage
    needs_backup: false
  # - name: forgejo
  #   needs_backup: false
  #   start_service: false
  # - name: vaultwarden
  #   needs_backup: false
  #   start_service: false
  #   - name: adguard-home
  #   needs_backup: false
  #   start_service: false

# Socket proxies Homarr's Docker integration connects to (tailnet TCP).
homarr_docker_hostnames: "desktop-docker-proxy.{{ tailnet_domain }},server-docker-proxy.{{ tailnet_domain }},prodesk-docker-proxy.{{ tailnet_domain }}"
homarr_docker_ports: "2375,2375,2375"
is_gui: true

# Agent scripts parse BBS_BACKUP_PLAN to stop/start the service being backed
# up, so the per-service systemd timer bracketing units are skipped.
bbs_use_agent_scripts: true
ansible_python_interpreter: /usr/bin/python3
