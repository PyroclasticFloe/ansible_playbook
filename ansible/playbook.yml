---
- name: Install packages
  hosts: containers
  become: true
  roles:
    - packages

- name: Install containers
  hosts: containers
  become: true

  tasks:
    - name: Check for containers policy.json
      ansible.builtin.stat:
        path: /etc/containers/policy.json
      register: policy_json

    - name: Ensure containers policy.json exists
      ansible.builtin.copy:
        dest: /etc/containers/policy.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "default": [
              {
                "type": "insecureAcceptAnything"
              }
            ],
            "transports": {
              "docker-daemon": {
                "": [
                  {
                    "type": "insecureAcceptAnything"
                  }
                ]
              }
            }
          }
      when: not policy_json.stat.exists

    - name: Enable Podman API socket (Docker-compatible /run/podman/podman.sock)
      ansible.builtin.systemd:
        name: podman.socket
        state: started
        enabled: true

    - name: Install borgmatic backup system
      ansible.builtin.include_role:
        name: containers
        tasks_from: install_borgmatic.yml
      when: backup_enabled | default(true)

    - name: Install each container service
      ansible.builtin.include_role:
        name: containers
      vars:
        service_name: "{{ service.name if service is mapping else service }}"
        tailscale_hostname: "{{ (service.tailscale_hostname | default(service_name)) if service is mapping else service_name }}"
        needs_backup: "{{ service.needs_backup | default(true) if service is mapping else true }}"
        start_service: "{{ service.start_service | default(true) if service is mapping else true }}"
        needs_restore: "{{ service.needs_restore | default(false) if service is mapping else false }}"
        restore_time: "{{ service.restore_time | default('04:00') if service is mapping else '04:00' }}"
        backup_frequency: "{{ service.backup_frequency | default('1 day') if service is mapping else '1 day' }}"
        restore_from_repo: "{{ service.restore_from_repo | default('') if service is mapping else '' }}"
        restore_from_label: "{{ service.restore_from_label | default('') if service is mapping else '' }}"
        bbs_backup: "{{ service.bbs_backup | default(false) if service is mapping else false }}"
        bbs_stop_time: "{{ service.bbs_stop_time | default('01:00') if service is mapping else '01:00' }}"
        bbs_start_time: "{{ service.bbs_start_time | default('01:15') if service is mapping else '01:15' }}"
      loop: "{{ enabled_services }}"
      loop_control:
        loop_var: service

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: (changed_units | default([])) | length > 0

    - name: Restart services with changed configuration
      ansible.builtin.systemd:
        name: "{{ unit }}"
        state: restarted
      loop: "{{ (changed_units | default([])) | unique }}"
      loop_control:
        loop_var: unit
