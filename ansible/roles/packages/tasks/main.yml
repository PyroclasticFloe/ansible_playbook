---
- name: Check if first-run upgrade has already run
  ansible.builtin.stat:
    path: /root/.ansible_first_run_complete
  register: first_run_marker

- name: Upgrade all dnf packages (first run only)
  ansible.builtin.dnf:
    name: "*"
    state: latest
  when: not first_run_marker.stat.exists

- name: Mark first run as complete
  ansible.builtin.file:
    path: /root/.ansible_first_run_complete
    state: touch
  when: not first_run_marker.stat.exists

- name: Include CLI package list
  ansible.builtin.include_vars: cli.yml

- name: Install CLI tools
  ansible.builtin.dnf:
    name: "{{ cli_packages }}"
    state: present

- name: Include GUI package list
  ansible.builtin.include_vars: gui.yml
  when: is_gui | default(false)

- name: Import Microsoft GPG key for VS Code
  ansible.builtin.rpm_key:
    key: https://packages.microsoft.com/keys/microsoft.asc
    state: present
  when: is_gui | default(false)

- name: Add VS Code repository
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/vscode.repo
    content: |
      [code]
      name=Visual Studio Code
      baseurl=https://packages.microsoft.com/yumrepos/vscode
      enabled=1
      autorefresh=1
      type=rpm-md
      gpgcheck=1
      gpgkey=https://packages.microsoft.com/keys/microsoft.asc
  when: is_gui | default(false)

- name: Install GUI packages
  ansible.builtin.dnf:
    name: "{{ gui_packages }}"
    state: present
  when: is_gui | default(false)

- name: Remove plasma-discover-packagekit
  ansible.builtin.dnf:
    name: plasma-discover-packagekit
    state: absent
  when: is_gui | default(false)

- name: Include Flatpak package list
  ansible.builtin.include_vars: flatpak.yml
  when: is_gui | default(false)

- name: Add Flathub remote
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
  when: is_gui | default(false)

- name: Update all Flatpak packages
  ansible.builtin.command:
    cmd: flatpak update -y --system
  register: flatpak_update
  changed_when: '"Nothing to do" not in flatpak_update.stdout'
  when: is_gui | default(false)

- name: Install Flatpak packages
  community.general.flatpak:
    name: "{{ flatpak_packages }}"
    state: present
  when: is_gui | default(false)

- name: Install Nvidia drivers
  ansible.builtin.dnf:
    name: akmod-nvidia
    state: present
  when: is_nvidia | default(false)

- name: Add Nvidia Container Toolkit COPR repository
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/copr-ai-ml-nvidia-container-toolkit.repo
    content: |
      [copr:copr.fedorainfracloud.org:group_ai-ml:nvidia-container-toolkit]
      name=Copr repo for nvidia-container-toolkit owned by @ai-ml
      baseurl=https://download.copr.fedorainfracloud.org/results/@ai-ml/nvidia-container-toolkit/fedora-$releasever-$basearch/
      type=rpm-md
      skip_if_unavailable=True
      gpgcheck=1
      gpgkey=https://download.copr.fedorainfracloud.org/results/@ai-ml/nvidia-container-toolkit/pubkey.gpg
      repo_gpgcheck=0
      enabled=1
      enabled_metadata=1
  when: is_nvidia | default(false)

- name: Install Nvidia Container Toolkit
  ansible.builtin.dnf:
    name:
      - nvidia-container-toolkit
      - nvidia-container-toolkit-selinux
    state: present
  when: is_nvidia | default(false)

- name: Deploy nvidia-device-init systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nvidia-device-init.service
    content: |
      [Unit]
      Description=Ensure NVIDIA device nodes exist before GPU containers start

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/nvidia-smi
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  when: is_nvidia | default(false)

- name: Reload systemd for nvidia-device-init
  ansible.builtin.systemd:
    daemon_reload: true
  when: is_nvidia | default(false)

- name: Enable and start nvidia-device-init
  ansible.builtin.systemd:
    name: nvidia-device-init
    enabled: true
    state: started
  when: is_nvidia | default(false)

- name: Disable systemd OSC 3008 context signalling (profile script)
  ansible.builtin.file:
    path: /etc/profile.d/80-systemd-osc-context.sh
    state: absent

- name: Disable systemd OSC 3008 context signalling (tmpfiles fragment)
  ansible.builtin.file:
    path: /etc/tmpfiles.d/20-systemd-osc-context.conf
    src: /dev/null
    state: link
    force: true

