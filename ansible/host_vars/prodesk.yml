enabled_services:
  - name: vaultwarden
    needs_backup: false
    bbs_backup: true
    bbs_stop_time: "01:00"
    bbs_start_time: "01:30"
  - name: forgejo
    needs_backup: false
    bbs_backup: true
    bbs_stop_time: "02:00"
    bbs_start_time: "02:30"
  - name: docker-socket-proxy
    tailscale_hostname: prodesk-docker-proxy
    needs_backup: false

# No backups yet; enable once the SSH automation key is registered on rsync.net
# and prodesk is a stable backup writer.
backup_enabled: false
ansible_python_interpreter: /usr/bin/python3
