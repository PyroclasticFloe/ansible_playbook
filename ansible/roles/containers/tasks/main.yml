---
- name: Load service defaults
  ansible.builtin.include_vars:
    file: "{{ service_dir }}/defaults.yml"

# include_vars loads into play scope and persists across service iterations,
# so a runtime_directories set by one service (e.g. valkey in searxng) would
# otherwise leak into every later service. Snapshot it then clear.
- name: Capture runtime directories for this service
  ansible.builtin.set_fact:
    service_runtime_directories: "{{ runtime_directories | default([]) }}"
    runtime_directories: []

- name: Compute systemd units for this service
  ansible.builtin.set_fact:
    systemd_units: >-
      {{
        (
          ([service_name ~ "-pod"] if (pod_enabled | default(false)) else [])
          + [service_name]
          + (
              sidecars
              | default([])
              | map('regex_replace', '^(.*)$', service_name ~ '-\\1')
              | list
            )
          + ([service_name ~ "-tailscale"] if (tailscale | default(false)) else [])
        )
      }}

- name: Install service configuration
  ansible.builtin.include_tasks: install_service.yml

- name: Install service secrets
  ansible.builtin.include_tasks: install_secrets.yml

- name: Install runtime data
  ansible.builtin.include_tasks: install_var.yml

- name: Set persistent SELinux file context for container volumes
  ansible.builtin.command:
    cmd: "semanage fcontext -a -t container_file_t '{{ var_dir }}(/.*)?'"
  register: semanage_result
  failed_when: false
  changed_when: false

- name: Apply SELinux context to var directory
  ansible.builtin.command:
    cmd: "restorecon -R {{ var_dir }}"
  changed_when: false

- name: Install quadlets
  ansible.builtin.include_tasks: install_quadlets.yml

- name: Install sidecar
  ansible.builtin.include_tasks: install_sidecar.yml
  when: tailscale | default(false)

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Manage systemd service
  ansible.builtin.include_tasks: systemd.yml

- name: Install BBS backup stop/start units
  ansible.builtin.include_tasks: install_bbs.yml
  when: bbs_backup | default(false) and not (bbs_use_agent_scripts | default(false))

- name: Install BBS backup stop/start scripts
  ansible.builtin.include_tasks: install_bbs_scripts.yml
  when: bbs_backup | default(false) and (bbs_use_agent_scripts | default(false))
