enabled_services:
  - name: searxng
    needs_backup: false
  - name: jellyfin
    needs_backup: false
    bbs_backup: true
    # bbs_stop_time: "23:00"
    # bbs_start_time: "23:30"
  - name: borg-backup-server
    needs_backup: false
  - name: forgejo
    needs_backup: false
    start_service: false
    # needs_restore: true
    # restore_time: "04:00"
    # restore_from_repo: "ssh://de5097@de5097.rsync.net/./prodesk-forgejo"
    # restore_from_label: "prodesk-forgejo"
    # restore_from_host: prodesk
  - name: vaultwarden
    needs_backup: false
    start_service: false
    # needs_restore: true
    # restore_time: "04:00"
    # restore_from_repo: "ssh://de5097@de5097.rsync.net/./vaultwarden"
    # restore_from_label: "prodesk-vaultwarden"
    # restore_from_host: prodesk
  - name: docker-socket-proxy
    tailscale_hostname: desktop-docker-proxy
    needs_backup: false
  - name: homarr
    needs_backup: false
  - name: homepage
    needs_backup: false

# Socket proxies Homarr's Docker integration connects to (tailnet TCP).
homarr_docker_hostnames: "desktop-docker-proxy.{{ tailnet_domain }},server-docker-proxy.{{ tailnet_domain }},prodesk-docker-proxy.{{ tailnet_domain }}"
homarr_docker_ports: "2375,2375,2375"
is_gui: true

# Agent scripts parse BBS_BACKUP_PLAN to stop/start the service being backed
# up, so the per-service systemd timer bracketing units are skipped.
bbs_use_agent_scripts: true
ansible_python_interpreter: /usr/bin/python3
