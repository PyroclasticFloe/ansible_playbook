---
- name: Create quadlet directory
  ansible.builtin.file:
    path: "/etc/containers/systemd/{{ service_name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install quadlet container files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ quadlet_dir }}/"
    owner: root
    group: root
    mode: preserve
  loop: "{{ query('fileglob', service_dir ~ '/quadlets/*.container') }}"
  notify: Restart service

- name: Install quadlet pod file
  ansible.builtin.template:
    src: service.pod.j2
    dest: "{{ quadlet_dir }}/{{ service_name }}.pod"
    owner: root
    group: root
    mode: "0644"
  when: pod_enabled | default(true)
  notify: Restart service

- name: Build list of expected quadlet files
  ansible.builtin.set_fact:
    expected_quadlets: >-
      {{
        query('fileglob', service_dir ~ '/quadlets/*.container')
        | map('basename') | list
        + ([service_name ~ '.pod'] if (pod_enabled | default(true)) else [])
        + ([service_name ~ '-tailscale.container'] if (tailscale | default(false)) else [])
      }}

- name: Find deployed quadlet files
  ansible.builtin.find:
    paths: "{{ quadlet_dir }}"
    patterns:
      - "*.container"
      - "*.pod"
    file_type: file
  register: deployed_quadlets

- name: Remove stale quadlet files left by renames
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ deployed_quadlets.files }}"
  when: (item.path | basename) not in expected_quadlets
  notify:
    - Reload systemd
    - Restart service
